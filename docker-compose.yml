services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: raffle
      POSTGRES_USER: raffle
      POSTGRES_PASSWORD: raffle
    ports:
      - "5432:5432"
  rabbit:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
  redis:
    image: redis:7
    ports:
      - "6379:6379"