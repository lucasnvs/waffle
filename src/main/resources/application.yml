spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    addresses: ${RABBITMQ_URL}

  data:
    redis:
      url: ${REDIS_URL}

server:
  port: ${PORT:8080}


resilience4j:
  circuitbreaker:
    instances:
      ticketProducer:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - com.lucasnvs.waffle.common.exception.RaffleNotFoundException
          - com.lucasnvs.waffle.common.exception.RaffleNotOpenException
          - com.lucasnvs.waffle.common.exception.TicketAlreadySoldException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    doc-expansion: none
